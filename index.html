<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi Tim Bangun 3.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== LOGIN SCREEN ===== -->
  <section id="screen-login" class="screen active">
  <div class="card login-card">
    <img src="assets/logo.png" alt="Logo" class="login-logo" />
    <h1 class="login-title">ABSENSI TIM BANGUN</h1>

    <!-- Banner di bawah judul -->
    <div class="banner-slider" id="login-banner">
      <div class="banner-track" id="banner-track">
        <img src="assets/banner1.jpg" alt="Banner 1" class="banner-img" />
        <img src="assets/banner2.jpg" alt="Banner 2" class="banner-img" />
        <img src="assets/banner3.jpg" alt="Banner 3" class="banner-img" />
      </div>
    </div>

    <p class="login-sub">Masuk untuk melanjutkan</p>
    <div id="login-error" class="msg msg-error hidden"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" required autocomplete="username" placeholder="Masukkan username" />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="password-wrap">
          <input id="login-password" type="password" required autocomplete="current-password" placeholder="Masukkan password" />
          <button type="button" id="toggle-pw" class="toggle-pw" aria-label="Tampilkan password">👁️</button>
        </div>
      </div>
      <button id="login-btn" class="btn btn-primary" type="submit">Masuk</button>
    </form>

    <footer class="login-footer">Asa Yantama 2026</footer>
  </div>
</section>


  <!-- ===== HOME SCREEN (shared) ===== -->
  <section id="screen-home" class="screen hidden">
    <div class="card home-card">
      <!-- Topbar -->
      <div class="topbar">
        <div class="topbar-left">
          <img src="assets/logo.png" alt="Logo" class="topbar-logo" />
          <span class="brand-text">Absensi</span>
        </div>
        <div class="topbar-right">
          <span class="user-role-badge" id="user-role-badge">KARYAWAN</span>
          <button id="btn-logout" class="btn btn-sm btn-ghost">🚪 Keluar</button>
        </div>
      </div>

      <!-- Sapaan & Jam -->
      <div class="greeting" id="greeting">Halo, <strong id="user-name">...</strong></div>
      <div class="jam" id="jam">--:--</div>
      <div class="tanggal" id="tanggal">...</div>

      <!-- Banner Slider (juga di home) -->
      <div class="banner-slider home-banner">
        <div class="banner-track" id="home-banner-track">
          <img src="assets/banner1.jpg" alt="Banner 1" class="banner-img" />
          <img src="assets/banner2.jpg" alt="Banner 2" class="banner-img" />
          <img src="assets/banner3.jpg" alt="Banner 3" class="banner-img" />
        </div>
      </div>

      <!-- Konten dinamis per role -->
      <div id="dynamic-content"></div>
    </div>
  </section>

  <!-- ===== MODAL KAMERA ===== -->
  <div id="camera-modal" class="modal hidden">
    <div class="modal-box">
      <h2>📸 Ambil Foto</h2>
      <div class="camera-wrapper">
        <video id="camera-video" autoplay playsinline></video>
        <div class="face-grid"></div>
      </div>
      <canvas id="camera-canvas" class="hidden"></canvas>
      <div id="camera-actions" class="camera-actions">
        <button id="btn-capture" class="btn btn-primary">📷 Ambil</button>
        <button id="btn-cancel-camera" class="btn btn-ghost">Batal</button>
      </div>
      <div id="photo-preview-area" class="hidden">
        <img id="photo-preview" alt="Preview" />
        <div class="form-group">
          <label for="reason-input">Alasan (wajib jika telat/luar radius)</label>
          <textarea id="reason-input" rows="2" placeholder="Isi alasan..."></textarea>
        </div>
        <button id="btn-submit-attendance" class="btn btn-success">✅ Kirim Absen</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL DETAIL KARYAWAN ===== -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-box modal-box-wide">
      <h2 id="detail-title">Detail Karyawan</h2>
      <div id="detail-content"></div>
      <button id="btn-close-detail" class="btn btn-ghost">Tutup</button>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div id="toast-wrap"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
